# Le stockage des pièces — stockage.immipro.app (revue M16, D-29).
#
# Le navigateur y dépose (`PUT`) et y lit (`GET`) les pièces par des URL
# présignées de cinq minutes (règle d'architecture 4). Nginx relaie vers
# Garage, publié en boucle locale seulement (`127.0.0.1:9000`, compose).
#
# - `Host` est transmis tel quel : la signature SigV4 porte l'hôte, et un
#   hôte réécrit la rendrait invalide.
# - Ni `X-Frame-Options: DENY` ni `frame-ancestors 'none'` : l'aperçu d'une
#   pièce en B-05 est un cadre vers cette origine (F1). Ce vhost ne pose
#   aucun en-tête de l'application.
# - Le CORS est porté par Garage (règle du seau), pas ici : une seule
#   source, qui n'autorise que l'origine du site.
# - Rien n'est mis en tampon : un dépôt de dix mégaoctets passe en flux.

server {
    listen 80;
    server_name stockage.immipro.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stockage.immipro.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name stockage.immipro.app;

    ssl_certificate     /etc/letsencrypt/live/immipro.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immipro.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Dix mégaoctets par pièce (`TAILLE_MAXI_MO`), et la marge d'un en-tête.
    client_max_body_size 11m;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        # Lire, déposer, et le préliminaire CORS. Rien d'autre : ni
        # suppression, ni listage multi-parties depuis Internet.
        limit_except GET PUT OPTIONS {
            deny all;
        }
        proxy_pass http://127.0.0.1:9000;
    }
}
