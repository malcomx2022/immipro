# Limitation de débit : l'authentification et le paiement sont les cibles.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

server {
    listen 80;
    server_name immipro.bj www.immipro.bj;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name immipro.bj www.immipro.bj;

    ssl_certificate     /etc/letsencrypt/live/immipro.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immipro.bj/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Téléversement de pièces : seule route autorisée à recevoir du volume
    location /api/documents/upload {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3000;
        proxy_request_buffering off;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Les webhooks ne sont PAS limités en débit : leur signature est vérifiée.
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
