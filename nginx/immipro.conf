# Le site — immipro.app (D-29). Recopié à la main sur le VPS :
#   sudo cp nginx/*.conf /etc/nginx/sites-available/ && sudo ln -sf … sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (INSTALLATION-GITHUB.md, « nginx et certificats »). `scripts/verifier-nginx.sh`
# fait passer `nginx -t` à ces fichiers en CI, avec des certificats factices.
#
# Les en-têtes de sécurité de l'application (CSP, `nosniff`,
# `X-Frame-Options`, `Referrer-Policy`, `Permissions-Policy`) sont posés par
# Next, à un seul endroit (revue M16, F1). Nginx ne pose que HSTS, qui
# porte sur le domaine et non sur une réponse.

# Limitation de débit : l'authentification est la cible.
#
# La zone `auth` est partagée par l'inscription, la connexion et la
# réinitialisation, et compte par adresse. Derrière le NAT d'un opérateur
# mobile, beaucoup de candidats partagent une adresse : elle est donc plus
# large que la limite de l'application (dix appels par minute, par route et
# par adresse), qui reste la borne fine. Celle-ci arrête les rafales avant
# qu'elles n'atteignent le calcul d'empreinte du mot de passe.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# Port 80 : le défi de certbot (webroot, D-29), puis tout vers https sur le
# domaine nu.
server {
    listen 80;
    server_name immipro.app www.immipro.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://immipro.app$request_uri;
    }
}

# `www` redirige vers le domaine nu (D-29) : une seule origine, celle
# d'`APP_URL`, que le cookie et la vérification d'`Origin` (F2) connaissent.
server {
    listen 443 ssl;
    http2 on;
    server_name www.immipro.app;

    # Un seul certificat pour les trois noms (D-29).
    ssl_certificate     /etc/letsencrypt/live/immipro.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immipro.app/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        return 301 https://immipro.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name immipro.app;

    ssl_certificate     /etc/letsencrypt/live/immipro.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immipro.app/privkey.pem;

    # Au niveau du serveur, et aucune `location` ne pose d'`add_header` :
    # nginx n'hérite des `add_header` que dans une `location` qui n'en
    # déclare aucun. Celui de `/_next/static/` effaçait HSTS de tous les
    # fichiers du build (revue M16) ; Next pose déjà leur `Cache-Control`.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Aucune route de l'application ne reçoit de volume : les pièces
    # partent directement au stockage (`stockage.conf`).
    client_max_body_size 1m;

    # Les en-têtes transmis à l'application, posés une fois pour toutes les
    # `location`. Nginx n'hérite des `proxy_set_header` du niveau `server`
    # que dans une `location` qui n'en déclare aucun : les `location` qui
    # suivent n'en déclarent donc pas.
    #
    # `X-Forwarded-For` **écrase** la valeur du client au lieu de lui
    # ajouter l'adresse vue (`$proxy_add_x_forwarded_for`). La limitation de
    # débit de l'application compte par adresse sur les routes publiques :
    # avec l'ajout, le client écrivait lui-même le premier élément, et la
    # clé de comptage avec (revue du 07/10/2026, E1). L'application lit le
    # dernier élément ; écraser ici ferme aussi la porte à un ancien code.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un refus de débit est un 429, que l'écran sait dire (« trop de
    # requêtes »). Le 503 par défaut se lirait « service indisponible ».
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # Ce qui devine un secret ou envoie un courriel sans session : la
    # création de compte, la connexion, la demande et la saisie d'un code
    # de réinitialisation. `location /api/auth/` ne correspondait à aucune
    # route, et rien n'était limité ici.
    location ~ ^/api/comptes(/session|/mot-de-passe)?$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Les webhooks ne sont PAS limités en débit : leur signature est vérifiée.
    location /api/webhooks/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # L'état de service est interrogé toutes les quelques secondes par la
    # surveillance et le déploiement : il ne remplit pas le journal. Le
    # détail n'est lu qu'avec le jeton ou en administrateur (M10).
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
    }
}
