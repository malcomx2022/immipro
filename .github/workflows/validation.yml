# « Tout ce qui doit être vrai avant qu'une image parte. »
#
# Ce fichier est appelé par `ci.yml` sur chaque proposition, et par
# `deploy.yml` avant la construction de l'image. Un seul endroit, deux
# appelants : une vérification ajoutée ici entre en vigueur des deux côtés,
# et le déploiement ne peut pas être plus indulgent que la CI.
#
# Aucune étape ne porte `continue-on-error`. Une vérification qu'on peut
# ignorer n'est pas une porte, et la seule chose qu'elle protège est le
# sentiment d'être protégé.

name: Validation

on:
  workflow_call:

jobs:
  valider:
    runs-on: ubuntu-latest
    # Une base réelle. Trois choses ne se voient pas autrement : les
    # migrations appliquées sur une base vide, les garde-fous qu'elles
    # portent, et le worker qui crée ses files pg-boss au démarrage.
    # Le serveur seul est fourni ; chaque script crée et supprime la base
    # jetable dont il a besoin.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: immipro
          POSTGRES_PASSWORD: immipro
          POSTGRES_DB: immipro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U immipro -d immipro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://immipro:immipro@localhost:5432/immipro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Entête du résumé
        run: |
          echo "## Porte de qualité" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

      # `npm ci` et non `npm install` : l'installation suit le verrou, elle
      # ne le réécrit pas. Une dépendance qui dérive fait échouer ici, pas
      # en production.
      - name: Installation déterministe
        run: npm ci
      - run: npx prisma generate

      - name: Tests, types, lint, vocabulaire
        run: npm run check
      - run: echo "- **Tests, types, lint, vocabulaire** — \`npm run check\`" >> "$GITHUB_STEP_SUMMARY"

      # La construction fait partie de la porte : un projet dont les tests
      # passent mais qui ne construit pas n'est pas déployable. Elle produit
      # les deux artefacts — la sortie `standalone` et `dist/worker.js`.
      - name: Construction
        run: npm run build
      - run: echo "- **Construction** — \`next build\` + paquet du worker" >> "$GITHUB_STEP_SUMMARY"

      # `prisma validate` lit le schéma sans toucher à une base : l'URL doit
      # être syntaxiquement valide, rien de plus. Celle du service ferait
      # croire à une vérification de la base, qui a lieu plus bas.
      - name: Schéma Prisma
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://validation:validation@localhost:5432/validation
      - run: echo "- **Schéma** — \`prisma validate\`" >> "$GITHUB_STEP_SUMMARY"

      # Base vierge, toutes les migrations, puis trois questions : est-ce
      # qu'elles s'appliquent, est-ce que `schema.prisma` décrit ce qu'elles
      # produisent, et est-ce que les garde-fous viennent bien d'elles.
      - name: Migrations et garde-fous
        run: npm run smoke:migrations
      - run: echo "- **Migrations** — reconstruction complète sur base vierge, sans dérive de schéma" >> "$GITHUB_STEP_SUMMARY"
      - run: echo "- **Garde-fous SQL** — portés par les migrations, pas par la base de développement" >> "$GITHUB_STEP_SUMMARY"

      # Le paquet du worker, exécuté pour de bon : sans base, où il doit
      # échouer sur la connexion, puis sur une base vierge, où il doit
      # créer ses files et annoncer son démarrage.
      - name: Paquet du worker
        run: npm run smoke:worker -- --base
      - run: echo "- **Worker** — paquet exécuté sans base, puis démarré sur une base vierge" >> "$GITHUB_STEP_SUMMARY"

      # Le référentiel de règles se charge depuis l'image (dist/graine-regles.js) :
      # sans lui, une production neuve n'a aucune fiche, et B-02 ne crée pas de règle.
      - name: Chargement du référentiel
        run: npm run smoke:graine
      - run: echo "- **Référentiel** — paquet de la graine exécuté hors sources, deux fois, sans doublon" >> "$GITHUB_STEP_SUMMARY"

      # Le tunnel de paiement, sur une base réelle et un ouvreur simulé :
      # double soumission, reprise après réponse perdue, écart de montant,
      # fournisseur absent, ordre du webhook et du retour navigateur.
      - name: Tunnel de paiement
        run: npm run smoke:tunnel
      - run: echo "- **Tunnel de paiement** — ouverture, reprise et refus éprouvés sur base vierge" >> "$GITHUB_STEP_SUMMARY"

      # Le rail FedaPay avec son vrai adaptateur et la vraie route du
      # webhook, devant des réponses de la forme documentée : notre
      # référence dans custom_metadata, rien de non signé ne crédite (S.109).
      - name: Rail FedaPay de bout en bout
        run: npm run smoke:fedapay
      - run: echo "- **Rail FedaPay** — adaptateur réel, webhook signé, refus non signés éprouvés" >> "$GITHUB_STEP_SUMMARY"

      # Le rattrapage d'un webhook perdu : état retrouvé et appliqué par le
      # même service que les webhooks, course entre les deux, et la
      # frontière qui compte — une absence de réponse n'est pas un refus.
      - name: Réconciliation des paiements
        run: npm run smoke:reconciliation
      - run: echo "- **Réconciliation** — rattrapage, idempotence et course webhook éprouvés sur base vierge" >> "$GITHUB_STEP_SUMMARY"

      # Deux candidats sur le même créneau à la même milliseconde : c'est la
      # base qui arbitre, et cela ne se simule pas. Avec la confirmation par
      # notification signée, la libération, et la suppression de compte.
      - name: Parcours consultant
        run: npm run smoke:consultation
      - run: echo "- **Parcours consultant** — tenue, concurrence sur un créneau et confirmation payée" >> "$GITHUB_STEP_SUMMARY"

      # La conservation des pièces selon l'état du dossier (arbitrage S.78) :
      # la garde qui lie une pause à sa date, une purge qui laisse un dossier
      # soumis ou suspendu dans son état, et aucune échéance posée sans que
      # l'annonce soit partie.
      - name: Conservation des pièces
        run: npm run smoke:conservation
      # Entre apostrophes : un « : » suivi d'une espace dans une valeur nue
      # se lit comme une clé YAML, et le fichier entier était refusé.
      - run: 'echo "- **Conservation des pièces** — dossiers payés, soumis et suspendus : annonce, puis purge, et le dossier reste" >> "$GITHUB_STEP_SUMMARY"'

      # La demande de remboursement : deux reprises à la même
      # milliseconde, le retrait de droits qui n'a lieu qu'une fois, et la
      # dette qui survit à une réponse 200 du fournisseur.
      - name: Remboursement sortant
        run: npm run smoke:remboursement
      - run: echo "- **Remboursement sortant** — reprises concurrentes, retrait unique et dette conservée jusqu'à la notification" >> "$GITHUB_STEP_SUMMARY"

      # Le transport SMTP contre un vrai serveur local : le message part,
      # le rejeu d'une notification n'en produit pas un second, et le
      # journal ne porte ni l'objet ni le code qu'il contient.
      - name: Transport SMTP
        run: npm run smoke:courrier
      - run: echo "- **Transport SMTP** — envoi réel sur serveur local, rejeu sans doublon, journal sans code" >> "$GITHUB_STEP_SUMMARY"

      # La chaîne dépôt → quarantaine → balayage → promotion → analyse,
      # contre un moteur et un stockage objet d'essai. Ce qu'elle tient :
      # un fichier ne change de zone que sur un verdict « saine ».
      - name: Chaîne de balayage
        run: npm run smoke:balayage
      - run: echo "- **Balayage antivirus** — chaîne complète, promotion sur le seul verdict « saine », incident visible sans acceptation" >> "$GITHUB_STEP_SUMMARY"

      # La lecture d'une pièce, contre le vrai SDK parlant à un service
      # d'essai. Ce qu'elle tient : ce sont les octets qui partent et
      # jamais une URL, une lecture qui n'aboutit pas ne déclare rien
      # conforme et ne débite personne, et une saturation se rejoue au
      # lieu d'accuser le fichier.
      - name: Chaîne d'extraction
        run: npm run smoke:extraction
      - run: echo "- **Extraction documentaire** — octets transmis sans URL, mesure déterministe des durées, saturation rejouée sans débit" >> "$GITHUB_STEP_SUMMARY"

      # La mise en forme et la relecture d'une pièce rédigée, contre le
      # vrai SDK parlant à un service d'essai. Ce qu'elle tient : une
      # version non relue ne se lit jamais « rien à reprendre », une
      # relecture qui n'aboutit pas ne date rien et ne débite rien, et une
      # relecture réelle sans remarque reste un résultat.
      - name: Chaîne de rédaction
        run: npm run smoke:redaction
      - run: echo "- **Rédaction assistée** — aucun avis rendu sans lecture, relecture datée sur la version, jetons comptés même sans résultat" >> "$GITHUB_STEP_SUMMARY"

      # Les rappels d'échéance, contre un vrai serveur SMTP. Ce qu'elle
      # tient : un courrier part une fois, une urgence déjà rappelée ne
      # repart pas le lendemain, et une coupure ne marque rien — la
      # passe du lendemain reprend le rappel au lieu de le perdre.
      - name: Rappels d'échéance
        run: npm run smoke:rappels
      - run: echo "- **Rappels d'échéance** — un envoi par échéance, cadence hebdomadaire tenue, coupure reprise sans perte" >> "$GITHUB_STEP_SUMMARY"

      # Les transitions d'état d'un dossier, depuis PRET — le seul état qui
      # porte une `readyAt`, donc le seul depuis lequel la garde SQL peut
      # mordre. Six écritures sur sept la violaient, et la déclaration de
      # dépôt était refusée à tous les coups : rien, dans cette chaîne,
      # n'écrivait réellement dans une base avant elle.
      - name: Transitions d'état d'un dossier
        run: npm run smoke:transitions
      - run: echo "- **Transitions d'état** — dépôt, clôture, divergence, arbitrage, pack et purge passent depuis un dossier prêt ; une alerte perdue par personne" >> "$GITHUB_STEP_SUMMARY"

      # La publication d'une règle, et ce qu'elle déclenche. Deux choses
      # qu'aucun test pur ne peut tenir : la relecture par un second
      # opérateur, qui compare qui a écrit à qui publie, et la propagation
      # d'un seuil modifié jusqu'à la mise en pause du dossier.
      - name: Publication d'une règle
        run: npm run smoke:publication
      - run: echo "- **Publication d'une règle** — un seuil modifié est vu, relu par un second opérateur, et propagé selon son sens" >> "$GITHUB_STEP_SUMMARY"

      # Les textes juridiques (S.101) : une page n'existe qu'une fois validée
      # avec un relecteur nommé, une variable modifiée republie le texte
      # validé qui l'emploie, et aucune version publiée ne se réécrit.
      - name: Textes juridiques
        run: npm run smoke:juridique
      - run: echo "- **Textes juridiques** — validation nommée, republication sur variable, versions jamais réécrites" >> "$GITHUB_STEP_SUMMARY"

      # Troisième garde-fou de l'avis L.A : une relecture humaine de la
      # complétude se demande, reçoit sa réponse, et ne promet rien (S.113).
      - name: Relecture de la complétude
        run: npm run smoke:relecture
      - run: echo "- **Relecture de la complétude** — une demande en attente par dossier, réponse sans promesse, alerte au candidat" >> "$GITHUB_STEP_SUMMARY"
      - name: Factures et avoirs
        run: npm run smoke:facturation
      - run: echo "- **Factures et avoirs** — suite sans trou sous émissions simultanées, avoir adossé à sa facture, pièces immuables, série réelle fermée sans facturation" >> "$GITHUB_STEP_SUMMARY"
      - name: Changement de rôle journalisé
        run: npm run smoke:role
      - run: echo "- **Changement de rôle** — par le paquet de l'image, motif et auteur au journal, adresse vérifiée, jamais sans administrateur" >> "$GITHUB_STEP_SUMMARY"

      # La purge de rétention devant un stockage qui refuse : ce qui se
      # déclare purgé doit avoir réellement quitté le stockage (INV-5).
      - name: Purge de rétention
        run: npm run smoke:purge
      - run: echo "- **Purge de rétention** — rien ne se déclare purgé tant que les octets n'ont pas quitté le stockage" >> "$GITHUB_STEP_SUMMARY"

      # Le passage d'Essentiel à Dossier (S.88) : prix différentiel depuis
      # l'achat réel, une seule montée par achat, vingt analyses, rejeu
      # sans double crédit, remboursement du seul supplément.
      - name: Montée en gamme
        run: npm run smoke:montee
      - run: 'echo "- **Montée en gamme** — différence de prix, une montée par achat, rejeu sans double crédit, remboursement du supplément" >> "$GITHUB_STEP_SUMMARY"'

      # La date réelle du dépôt (S.89) : deux dates distinctes, déclaration
      # tardive sans purge immédiate, relances J+30 et J+60 sans rafale,
      # correction auditée, export.
      - name: Date réelle du dépôt
        run: npm run smoke:depot
      - run: 'echo "- **Date réelle du dépôt** — relances sans rafale, préavis tenu, correction auditée" >> "$GITHUB_STEP_SUMMARY"'

      # Sans clé, il s'abstient et le dit — il ne rend pas vert ce qu'il
      # n'a pas éprouvé. Avec des clés de bac à sable, il ouvre pour de bon.
      - name: Bac à sable des fournisseurs
        run: npm run sandbox:paiement
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
          FEDAPAY_API_KEY: ${{ secrets.FEDAPAY_SANDBOX_API_KEY }}
          FEDAPAY_ENVIRONMENT: sandbox

      - name: Verdict
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Validation complète. La construction de l'image peut suivre." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Validation en échec** — aucune image ne sera poussée." >> "$GITHUB_STEP_SUMMARY"
          fi
