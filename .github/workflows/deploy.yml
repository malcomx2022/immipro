name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Aucun droit par défaut : chaque job déclare ce qu'il lui faut — revue du
# 07/10/2026, E9.
permissions: {}

jobs:
  # La porte, avant tout le reste. Elle vivait dans un workflow séparé qui
  # tournait *en parallèle* de la construction : une image pouvait donc
  # partir sur GHCR pendant que les tests viraient au rouge, et le VPS la
  # tirait. `needs: valider` supprime cette course.
  valider:
    permissions: { contents: read }
    uses: ./.github/workflows/validation.yml
    # Les clés de bac à sable, pour que l'étape `sandbox:paiement` ouvre
    # pour de bon au lieu de s'abstenir. Nommées une à une, pas `inherit` :
    # la porte ne voit pas la clé de production.
    secrets:
      STRIPE_SANDBOX_API_KEY: ${{ secrets.STRIPE_SANDBOX_API_KEY }}
      FEDAPAY_SANDBOX_API_KEY: ${{ secrets.FEDAPAY_SANDBOX_API_KEY }}

  build:
    needs: valider
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    # En bloc, et non entre accolades : `${{ … }}` dans une table en ligne
    # ne s'analyse pas en YAML, et le fichier entier était refusé.
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construite une fois, chargée localement, éprouvée, puis poussée
      # telle quelle. Une seconde construction « pour pousser » rendrait la
      # vérification décorative : ce serait une autre image que celle qu'on
      # a regardée, même si le cache rend la différence improbable.
      #
      # Le cache reste en place — il fait gagner plusieurs minutes — et il
      # ne peut pas masquer une étape de construction absente : le
      # `COPY --from=builder /app/dist` échoue si plus rien ne produit le
      # paquet, et les commandes sont ensuite exécutées depuis l'image, pas
      # depuis l'arbre de travail.
      - name: Construire l'image candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: immipro:candidat
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Les commandes que `docker-compose.prod.yml` déclare, exécutées dans
      # cette image-là : celle du worker, qui doit échouer sur la connexion
      # et non sur un module manquant, et celle du service `app`, qui est
      # celle de l'image et doit rester debout.
      - name: Commandes des conteneurs, contre l'image produite
        run: npm run smoke:worker -- --image=immipro:candidat

      - name: Pousser l'image validée
        run: |
          set -euo pipefail
          depot="ghcr.io/${{ github.repository_owner }}/immipro"
          docker tag immipro:candidat "$depot:${{ steps.meta.outputs.tag }}"
          docker tag immipro:candidat "$depot:latest"
          docker push "$depot:${{ steps.meta.outputs.tag }}"
          docker push "$depot:latest"
          {
            echo "## Image"
            echo ""
            echo "- **Commandes des conteneurs** — worker et \`app\` exécutés depuis l'image"
            echo "- **Poussée** — \`$depot:${{ steps.meta.outputs.tag }}\`, l'empreinte éprouvée ci-dessus"
          } >> "$GITHUB_STEP_SUMMARY"

  # D-25, option A : `ssh` et `scp` natifs. L'hôte est vérifié contre
  # `VPS_KNOWN_HOSTS` (la ligne relevée depuis la console du fournisseur,
  # jamais par un premier `ssh-keyscan` qui croirait n'importe quel
  # serveur) ; aucune action tierce ne manipule la clé de production.
  #
  # Le compose et le script sont recopiés à chaque déploiement : le VPS
  # exécute ce que dit le dépôt. Les fichiers secrets (`.env.*`,
  # `garage.toml`) ne sont jamais touchés. Tout le reste — tirage,
  # sauvegarde, migration, garde-fous, sonde, retour arrière — est dans
  # `scripts/deployer.sh`, qui se lance aussi à la main.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clé et empreinte de l'hôte
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS est vide : y reporter la ligne de l'hôte relevée depuis la console du fournisseur (docs/exploitation/deploiement.md)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploiement
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploiement ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  Port $VPS_PORT"
            echo "  IdentityFile ~/.ssh/deploiement"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Recopier le compose et le script
        run: |
          set -euo pipefail
          ssh vps 'mkdir -p /srv/immipro/scripts /srv/immipro/.deploiement/arrivee'
          scp docker-compose.prod.yml vps:/srv/immipro/.deploiement/arrivee/docker-compose.prod.yml
          scp scripts/deployer.sh vps:/srv/immipro/scripts/deployer.sh
          ssh vps 'chmod 755 /srv/immipro/scripts/deployer.sh'

      - name: Déployer sur le VPS
        run: ssh vps "/srv/immipro/scripts/deployer.sh ${{ needs.build.outputs.tag }} ${{ github.repository_owner }}"

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploiement
