# Mises à jour proposées — revue du 07/10/2026, E9.
#
# Les actions sont épinglées par empreinte (SHA) : sans Dependabot, une
# empreinte ne bouge plus jamais, correctifs de sécurité compris. Il les
# tient à jour, avec le commentaire de version.
#
# Les mineures et correctifs arrivent groupés, une proposition par
# écosystème et par semaine : chacune passe la porte complète comme
# n'importe quelle autre. Les majeures sont ignorées ici : elles suivent
# l'ordre de montée de M19 (Node, Next, Prisma, pg-boss, vitest…), un lot
# par étape, et non au fil des sorties.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  # `docker/prisma-cli` porte la CLI Prisma de l'image, à version exacte :
  # celle du verrou racine (M15, `tests/image-production.test.ts`). Surveillé
  # seul `/`, Dependabot montait `prisma` à la racine et pas dans l'image, et
  # la porte refusait la proposition (#303, 22/10/2026). Les deux répertoires
  # partagent le groupe : une montée de Prisma arrive en une seule PR.
  - package-ecosystem: npm
    directories: [/, /docker/prisma-cli]
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-mineures:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
