# Production VPS. Rien n'est exposé hors du réseau Docker sauf l'application,
# en loopback, derrière Nginx.
#
# Revue du 07/10/2026, M15 (D-28 : VPS de 8 Go, rotation dans ce fichier) :
#
# - **journaux** : chaque service tourne ses journaux (`local`, 10 Mo × 5).
#   Sans rotation, un service bavard remplissait le disque et faisait
#   tomber la base avec lui ;
# - **mémoire** : chaque service a une limite. Environ 6,3 Go au total, ce
#   qui laisse le système, nginx et la marge des pointes sur 8 Go. Un
#   service qui s'emballe est tué seul au lieu d'affamer les autres ;
# - **sondes** : `docker compose ps` dit `healthy` ou `unhealthy` pour
#   chaque service, et non plus seulement « Up » ;
# - **images épinglées par empreinte** : un tag seul change sous les pieds
#   d'un `pull`. Dependabot tient les empreintes à jour.
x-journaux: &journaux
  driver: local
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    logging: *journaux
    mem_limit: 1g
    env_file: .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      retries: 5

  # Stockage objet S3 des pièces — I.D.
  #
  # MinIO n'est plus distribué en image Docker (source-only depuis fin
  # 09/2026 : `minio/minio` n'existe plus sur Docker Hub). Le service est
  # donc assuré par Garage (même image que les sauvegardes du VPS,
  # `dxflrs/garage:v2.2.0`, déjà éprouvée), qui expose une API S3
  # compatible avec le client `minio` de l'application
  # (`src/lib/storage.ts` : presigned GET/PUT, get, stat, copy, remove).
  #
  # Le nom du service reste `minio` : `MINIO_ENDPOINT=minio` dans
  # `.env.app` continue de fonctionner sans modification.
  #
  # Premier démarrage (à faire une fois, le layout persiste dans le
  # volume `miniometa`) :
  #   cid=$(docker compose exec minio /garage status | grep -oE '^[0-9a-f]{16}' | head -1)
  #   docker compose exec minio /garage layout assign -z dc1 -c 100G $cid
  #   docker compose exec minio /garage layout apply --version 1
  # puis les seaux et la clé d'accès (le secret ne s'affiche qu'une fois) :
  #   docker compose exec minio /garage bucket create immipro-documents
  #   docker compose exec minio /garage bucket create immipro-quarantaine
  #   docker compose exec minio /garage key create immipro-app
  #   docker compose exec minio /garage bucket allow --read --write immipro-documents --key <ID>
  #   docker compose exec minio /garage bucket allow --read --write immipro-quarantaine --key <ID>
  # et reporter l'ID et le secret dans MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
  # de `.env.app` (`.env.minio` est conservé pour mémoire).
  #
  # `garage.toml` porte un secret RPC : le dépôt ne contient qu'un modèle
  # (secret à remplacer), le serveur porte le vrai fichier (600).
  minio:
    image: dxflrs/garage:v2.2.0@sha256:45a61ce3f7c9c24fc23d9ed2b09b27ed560ab87b34605d175d5c588f539c24e4
    restart: unless-stopped
    logging: *journaux
    mem_limit: 512m
    command: ["/garage", "server"]
    # L'image n'a pas de shell : la sonde appelle le binaire directement.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Publié en loopback pour le vhost nginx du stockage public
    # (https://stockage.immipro.app) — jamais exposé sur Internet.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata:/var/lib/garage/data
      - miniometa:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml:ro
    networks: [internal]

  app:
    image: ghcr.io/${GH_OWNER}/immipro:${TAG}
    restart: unless-stopped
    logging: *journaux
    mem_limit: 768m
    env_file: .env.app
    # Le tas de V8 sous la limite du conteneur : passé 512 Mo, Node ramasse
    # au lieu d'être tué par le noyau sans un mot au journal.
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    # Une sonde de **vie**, sans base : `/robots.txt` répond tant que le
    # serveur tourne. `/api/health` dit l'aptitude et la base, et répond 503
    # sans panne quand l'instance est inapte (S.132) : il ne doit pas faire
    # déclarer le conteneur malade.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

  # Les acteurs SYS de DOC-11 — purge (INV-5), réconciliation des
  # paiements (INV-7), veille (RG-14.1), balayage puis analyse, péremption
  # des pièces (RG-07.4). Service séparé, même image : un travail de fond
  # dans le processus web partagerait sa mémoire et son cycle de vie.
  #
  # `dist/worker.js` est produit par `npm run build` pendant la
  # construction de l'image, et copié par le Dockerfile. Ce n'est pas du
  # TypeScript interprété au démarrage, et rien n'est téléchargé à
  # l'exécution.
  #
  # `--enable-source-maps` : la carte est dans l'image, et un worker qui
  # redémarre en boucle est le cas où une pile lisible se paie.
  worker:
    image: ghcr.io/${GH_OWNER}/immipro:${TAG}
    restart: unless-stopped
    logging: *journaux
    mem_limit: 768m
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    env_file: .env.app
    environment:
      NODE_OPTIONS: --max-old-space-size=512
    # Le temps de finir le travail en cours avant le SIGKILL : une purge ou
    # un remboursement interrompu au milieu se reprend, mais autant ne pas
    # l'interrompre à chaque déploiement.
    stop_grace_period: 30s
    # Le battement (`src/server/jobs/battement.ts`) : toutes les 30 s, le
    # worker interroge la base puis réécrit ce fichier. Plus vieux que 90 s,
    # le worker est figé ou ne joint plus la base.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker-battement) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # Balayage antivirus des pièces — I.D, branché par S.96.
  #
  # Deux conteneurs, parce que ClamAV n'expose pas d'HTTP et que le contrat
  # de `ANTIVIRUS_URL` en est un (`domain/securite/balayage.ts`) :
  #
  # - `clamav` : le démon et freshclam, qui tient les signatures à jour
  #   seul, plusieurs fois par jour. Les signatures vivent dans un volume :
  #   un redémarrage ne les retélécharge pas. Le premier démarrage, lui,
  #   les télécharge, et clamd n'écoute qu'une fois chargées — compter une
  #   à deux minutes. Pendant ce temps, les pièces attendent en quarantaine
  #   et la sonde horaire du worker rattrape le constat.
  # - `antivirus` : la passerelle HTTP, même image que l'application.
  #
  # Mémoire : clamd tient les signatures en mémoire, autour de 1,5 Go, et
  # le double le temps d'un rechargement. Le VPS doit les avoir.
  #
  # Rien n'est exposé hors du réseau interne. Le worker joint la passerelle
  # par `ANTIVIRUS_URL=http://antivirus:8080/balayer`, dans `.env.app`.
  #
  # Aucun `depends_on` du worker vers eux : un antivirus en panne laisse
  # les pièces en quarantaine, il ne doit pas arrêter la purge ni les
  # paiements.
  clamav:
    image: clamav/clamav:1.4@sha256:57deb108fc4c72778aa83eafbca7bb7153e28c3f57c005afd38d31f16da86f23
    restart: unless-stopped
    logging: *journaux
    # Les signatures en mémoire (~1,5 Go), le double pendant un rechargement.
    mem_limit: 3g
    # La limite du flux suit celle du balayeur (`TAILLE_MAXI_BALAYAGE_OCTETS`,
    # 32 Mo). Au-dessous, un fichier accepté par le balayeur serait refusé
    # par le démon, et resterait en quarantaine à chaque reprise. L'image
    # porte son propre contrôle de santé (`clamdcheck.sh`).
    environment:
      CLAMD_CONF_StreamMaxLength: 32M
    volumes:
      - clamdb:/var/lib/clamav
    networks: [internal]

  antivirus:
    image: ghcr.io/${GH_OWNER}/immipro:${TAG}
    restart: unless-stopped
    logging: *journaux
    mem_limit: 256m
    command: ["node", "--enable-source-maps", "dist/passerelle-antivirus.js"]
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      PORT: "8080"
    networks: [internal]
    # Vert quand clamd répond PONG : `docker compose ps` dit alors si le
    # démon est debout, sans ouvrir la moindre pièce.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/sante > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

networks:
  internal: { driver: bridge }

volumes:
  pgdata:
  miniodata:
  miniometa:
  clamdb:
